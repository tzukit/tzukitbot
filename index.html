<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的指令表</title>
<meta name="description" content="聊天室指令一覽：包含指令說明、權限、冷卻與別名。">
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0d0e12;
  --bg-inset: #12141a;
  --bg-card: #16181f;
  --bg-elev: #1b1e27;
  --border: #272b36;
  --border-strong: #363c4a;
  --text: #e8eaf0;
  --dim: #98a0b0;
  --faint: #6b7280;
  --brand: #8b7cff;
  --brand-soft: rgba(139, 124, 255, .14);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Microsoft JhengHei Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
  --gap: 14px;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--dim); }
.small { font-size: .875rem; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.pub-head { margin: 26px 0 18px; }
.pub-head h1 { margin: 0 0 .25em; font-size: 1.7rem; }
.pub-head .lead { color: var(--dim); margin: 0; }
.pub-head code, .pub-note code {
  font-family: var(--mono);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
}
.pub-search { margin-bottom: 18px; }
.pub-search input {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  padding: 10px 14px;
  outline: none;
}
.pub-search input:focus { border-color: var(--brand); }
.pub-search input::placeholder { color: var(--faint); }
.pub-search .count { margin: 6px 2px 0; }
.cmd-group {
  margin-bottom: var(--gap);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px 16px;
}
.cmd-group h2 {
  margin: 0 0 12px;
  font-size: 1.08rem;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.cmd-list {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.cmd {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  min-width: 0;
}
.cmd .usage {
  font-family: var(--mono);
  font-size: .95rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.cmd .sum { margin: 0; color: var(--dim); font-size: .9rem; overflow-wrap: anywhere; }
.cmd .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 0; }
.badge {
  display: inline-block;
  font-size: .78rem;
  font-weight: 600;
  line-height: 1.4;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge.brand {
  background: var(--brand-soft);
  border-color: rgba(139, 124, 255, .45);
  color: #b3a8ff;
}
.chip {
  display: inline-block;
  font-size: .78rem;
  line-height: 1.4;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--dim);
  overflow-wrap: anywhere;
  max-width: 100%;
}
.pub-note { color: var(--dim); font-size: .9rem; margin-top: 18px; }
.empty {
  text-align: center;
  color: var(--dim);
  background: var(--bg-card);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 26px 14px;
}
.foot {
  margin-top: 34px;
  border-top: 1px solid var(--border);
  padding: 16px 0 26px;
  font-size: .875rem;
  color: var(--dim);
}
.foot .foot-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
}
@media (max-width: 640px) {
  .cmd-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<main class="wrap">
  <header class="pub-head">
    <h1 data-site-title>我的指令表</h1>
    <p class="lead">
      在聊天室輸入下面的指令就會有反應。這個頻道的指令前綴是
      <code data-site-prefix>!</code>，目前有 <b data-total>0</b> 個指令可以用。
    </p>
  </header>

  <div class="pub-search">
    <label class="sr-only" for="cmd-q">搜尋指令</label>
    <input id="cmd-q" type="search" autocomplete="off" spellcheck="false"
           placeholder="搜尋指令名稱或說明…" data-cmd-search>
    <p class="count small muted" data-cmd-count hidden></p>
  </div>

  <div id="groups">
    <p class="muted small">載入中…</p>
  </div>

  <p class="empty" data-empty hidden></p>

  <p class="pub-note" data-note hidden>
    找不到想要的？頁面內容由頻道主自行維護，隨時可能調整。
  </p>
</main>

<footer class="foot">
  <div class="wrap foot-row">
    <span data-foot-title>指令表</span>
    <span class="muted">指令由頻道主自行設定，隨時可能調整。</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var DATA = { title: "我的指令表", prefix: "!", groups: [] };
  var query = "";

  var el = {
    title: document.querySelector("[data-site-title]"),
    footTitle: document.querySelector("[data-foot-title]"),
    prefix: document.querySelector("[data-site-prefix]"),
    total: document.querySelector("[data-total]"),
    search: document.querySelector("[data-cmd-search]"),
    count: document.querySelector("[data-cmd-count]"),
    groups: document.getElementById("groups"),
    empty: document.querySelector("[data-empty]"),
    note: document.querySelector("[data-note]")
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function norm(s) { return String(s == null ? "" : s).toLowerCase(); }

  function sanitize(raw) {
    var d = raw && typeof raw === "object" ? raw : {};
    var data = {
      title: (typeof d.title === "string" && d.title.trim()) ? d.title : "我的指令表",
      prefix: (typeof d.prefix === "string" && d.prefix) ? d.prefix : "!",
      groups: []
    };
    (Array.isArray(d.groups) ? d.groups : []).forEach(function (g) {
      if (!g || typeof g !== "object") return;
      var group = { name: String(g.name || "未命名分類"), commands: [] };
      (Array.isArray(g.commands) ? g.commands : []).forEach(function (c) {
        if (!c || typeof c !== "object") return;
        group.commands.push({
          name: String(c.name || ""),
          description: String(c.description || ""),
          permission: String(c.permission || ""),
          cooldown: String(c.cooldown || ""),
          aliases: Array.isArray(c.aliases) ? c.aliases.map(String) : []
        });
      });
      data.groups.push(group);
    });
    return data;
  }

  function matches(c, q) {
    if (!q) return true;
    return (norm(c.name) + " " + norm(c.description) + " " +
      norm(c.permission) + " " + norm(c.cooldown) + " " +
      c.aliases.map(norm).join(" ")).indexOf(q) !== -1;
  }

  function cmdHtml(c, prefix) {
    var h = '<article class="cmd">';
    h += '<span class="usage">' + esc(prefix + c.name) + "</span>";
    if (c.description) h += '<p class="sum">' + esc(c.description) + "</p>";
    var meta = [];
    if (c.permission) meta.push('<span class="badge brand">' + esc(c.permission) + "</span>");
    if (c.cooldown) meta.push('<span class="chip">冷卻：' + esc(c.cooldown) + "</span>");
    if (c.aliases.length) {
      meta.push('<span class="chip">也可以打：' +
        c.aliases.map(function (a) { return esc(prefix + a); }).join("、") + "</span>");
    }
    if (meta.length) h += '<p class="meta">' + meta.join("") + "</p>";
    return h + "</article>";
  }

  function render() {
    var prefix = DATA.prefix;
    var q = norm(query.trim());
    var shown = 0, total = 0, html = "";

    DATA.groups.forEach(function (g) {
      total += g.commands.length;
      var cmds = g.commands.filter(function (c) { return matches(c, q); });
      if (!cmds.length) return;
      shown += cmds.length;
      html += '<section class="cmd-group"><h2>' + esc(g.name) +
        ' <span class="muted small">（' + cmds.length + "）</span></h2>" +
        '<div class="cmd-list">' + cmds.map(function (c) { return cmdHtml(c, prefix); }).join("") +
        "</div></section>";
    });

    el.groups.innerHTML = html;
    el.total.textContent = String(total);
    el.title.textContent = DATA.title;
    el.footTitle.textContent = DATA.title;
    document.title = DATA.title;
    el.prefix.textContent = prefix;

    var searching = q.length > 0;
    el.count.hidden = !searching;
    if (searching) el.count.textContent = "顯示 " + shown + " / " + total + " 個指令";

    var none = DATA.groups.length === 0 || (searching && shown === 0);
    el.empty.hidden = !none;
    if (DATA.groups.length === 0) el.empty.textContent = "還沒有任何指令。";
    else if (searching && shown === 0) el.empty.textContent = "沒有符合的指令。換個關鍵字試試看。";
    el.note.hidden = DATA.groups.length === 0;
  }

  function showLoadError(msg) {
    el.groups.innerHTML = "";
    el.empty.hidden = false;
    el.empty.textContent = msg;
  }

  async function load() {
    if (location.protocol === "file:") {
      showLoadError("無法在「直接雙擊開啟」的情況下讀取 commands.json。" +
        "請用本機伺服器預覽（在此資料夾執行 python -m http.server 8000），" +
        "或把檔案上傳到 GitHub Pages 後再打開。");
      return;
    }
    try {
      var res = await fetch("./commands.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      DATA = sanitize(await res.json());
      render();
    } catch (err) {
      console.error(err);
      showLoadError("載入 commands.json 失敗，請稍後再試。");
    }
  }

  el.search.addEventListener("input", function () {
    query = el.search.value;
    render();
  });

  load();
})();
</script>
</body>
</html>
