<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指令表編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap admin-wrap">
  <header class="admin-head">
    <h1>指令表編輯器</h1>
    <div class="head-links">
      <a href="./index.html">預覽瀏覽頁 ↗</a>
    </div>
  </header>

  <section class="card token-panel" id="token-panel">
    <h2>GitHub 儲存設定 <span class="token-state" data-token-state hidden></span></h2>
    <div class="token-row">
      <label class="field">儲存庫（使用者名稱／儲存庫名稱）
        <input type="text" data-repo placeholder="octocat/command-website" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">GitHub Token
        <input type="password" data-token placeholder="ghp_… 或 github_pat_…" spellcheck="false" autocomplete="off">
      </label>
      <div class="settings-btns">
        <button type="button" class="btn btn-primary" data-save-settings>儲存設定</button>
        <button type="button" class="btn btn-ghost" data-clear-settings>清除</button>
      </div>
    </div>
    <p class="token-hint">
      Token 只存在這台電腦的瀏覽器（localStorage），不會寫進網站檔案。
      建立方式：<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token</a>
      （此儲存庫 Contents: <b>Read and write</b>）或 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">經典 token</a>（勾選 <code>repo</code>）。
    </p>
  </section>

  <div class="banner warn" data-draft-banner hidden>
    <span>瀏覽器裡有一份未儲存的變更（<span data-draft-ts></span>）。</span>
    <span class="banner-spacer"></span>
    <button type="button" class="btn btn-sm" data-discard-draft>捨弃變更，重新載入</button>
    <button type="button" class="btn btn-sm btn-ghost" data-keep-draft>繼續編輯</button>
  </div>

  <div class="admin-bar">
    <span class="pill saved" data-pill>已儲存</span>
    <button type="button" class="btn" data-add-group>＋ 新增分類</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary" data-save>儲存到 GitHub</button>
    <button type="button" class="btn" data-reload>重新載入</button>
    <button type="button" class="btn" data-export>匯出</button>
    <label class="btn" for="import-file">匯入</label>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
  </div>

  <div class="card site-meta">
    <label class="field">網站標題
      <input type="text" data-meta-title placeholder="我的指令表">
    </label>
    <label class="field">指令前綴
      <input type="text" data-meta-prefix maxlength="5" placeholder="!" spellcheck="false">
    </label>
  </div>

  <div id="groups"></div>

  <div class="admin-empty" data-admin-empty hidden>
    <p><b>還沒有任何分類。</b></p>
    <p>按上方的「＋ 新增分類」開始建立指令表，<br>
       再用「＋ 新增指令」加入方塊；拖曳 <span class="handle">⠿</span> 可重新排序。</p>
  </div>
</main>

<datalist id="perm-list">
  <option value="所有觀眾"></option>
  <option value="管理員以上"></option>
  <option value="VIP 以上"></option>
  <option value="版主以上"></option>
  <option value="所有觀眾・等級 100 以上"></option>
  <option value="管理員"></option>
</datalist>

<div id="toast" role="status"></div>

<script src="admin.js" defer></script>
</body>
</html>
