<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的指令表</title>
<meta name="description" content="聊天室指令一覽：包含指令說明、權限、冷卻與別名。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <span class="brand"><span class="brand-dot"></span>指令表</span>
    <div class="nav-search">
      <label class="sr-only" for="cmd-q">搜尋指令</label>
      <input id="cmd-q" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜尋指令名稱或說明…" data-cmd-search>
      <p class="count" data-cmd-count hidden></p>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <h1 data-site-title>我的指令表</h1>
    <p class="lead">
      在聊天室輸入下面的指令就會有反應。這個頻道的指令前綴是
      <code data-site-prefix>!</code>，目前有 <b data-total>0</b> 個指令可以用。
    </p>
  </div>
</header>

<main class="wrap content">
  <div id="groups">
    <p class="muted small">載入中…</p>
  </div>

  <p class="empty" data-empty hidden></p>

  <p class="pub-note" data-note hidden>
    找不到想要的？頁面內容由頻道主自行維護，隨時可能調整。
  </p>
</main>

<footer class="foot">
  <div class="wrap foot-row">
    <span data-foot-title>指令表</span>
    <span class="muted">指令由頻道主自行設定，隨時可能調整。</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var DATA = { title: "我的指令表", prefix: "!", groups: [] };
  var query = "";

  var el = {
    title: document.querySelector("[data-site-title]"),
    footTitle: document.querySelector("[data-foot-title]"),
    prefix: document.querySelector("[data-site-prefix]"),
    total: document.querySelector("[data-total]"),
    search: document.querySelector("[data-cmd-search]"),
    count: document.querySelector("[data-cmd-count]"),
    groups: document.getElementById("groups"),
    empty: document.querySelector("[data-empty]"),
    note: document.querySelector("[data-note]")
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function norm(s) { return String(s == null ? "" : s).toLowerCase(); }

  function sanitize(raw) {
    var d = raw && typeof raw === "object" ? raw : {};
    var data = {
      title: (typeof d.title === "string" && d.title.trim()) ? d.title : "我的指令表",
      prefix: (typeof d.prefix === "string" && d.prefix) ? d.prefix : "!",
      groups: []
    };
    (Array.isArray(d.groups) ? d.groups : []).forEach(function (g) {
      if (!g || typeof g !== "object") return;
      var group = { name: String(g.name || "未命名分類"), commands: [] };
      (Array.isArray(g.commands) ? g.commands : []).forEach(function (c) {
        if (!c || typeof c !== "object") return;
        group.commands.push({
          name: String(c.name || ""),
          usage: (typeof c.usage === "string" && c.usage.trim()) ? c.usage : "",
          description: String(c.description || ""),
          permission: String(c.permission || ""),
          cooldown: String(c.cooldown || ""),
          aliases: Array.isArray(c.aliases) ? c.aliases.map(String) : []
        });
      });
      data.groups.push(group);
    });
    return data;
  }

  function matches(c, q) {
    if (!q) return true;
    return (norm(c.name) + " " + norm(c.description) + " " +
      norm(c.permission) + " " + norm(c.cooldown) + " " +
      c.aliases.map(norm).join(" ")).indexOf(q) !== -1;
  }

  function cmdHtml(c, prefix) {
    var h = '<article class="cmd">';
    h += '<span class="usage">' + esc(c.usage || prefix + c.name) + "</span>";
    if (c.description) h += '<p class="sum">' + esc(c.description) + "</p>";
    var meta = [];
    if (c.permission) meta.push('<span class="badge brand">' + esc(c.permission) + "</span>");
    if (c.cooldown) meta.push('<span class="chip">冷卻：' + esc(c.cooldown) + "</span>");
    if (c.aliases.length) {
      meta.push('<span class="chip">也可以打：' +
        c.aliases.map(function (a) { return esc(prefix + a); }).join("、") + "</span>");
    }
    if (meta.length) h += '<p class="meta">' + meta.join("") + "</p>";
    return h + "</article>";
  }

  function render() {
    var prefix = DATA.prefix;
    var q = norm(query.trim());
    var shown = 0, total = 0, html = "";

    DATA.groups.forEach(function (g) {
      total += g.commands.length;
      var cmds = g.commands.filter(function (c) { return matches(c, q); });
      if (!cmds.length) return;
      shown += cmds.length;
      html += '<section class="cmd-group"><h2>' + esc(g.name) +
        ' <span class="muted small">（' + cmds.length + "）</span></h2>" +
        '<div class="cmd-list">' + cmds.map(function (c) { return cmdHtml(c, prefix); }).join("") +
        "</div></section>";
    });

    el.groups.innerHTML = html;
    el.total.textContent = String(total);
    el.title.textContent = DATA.title;
    el.footTitle.textContent = DATA.title;
    document.title = DATA.title;
    el.prefix.textContent = prefix;

    var searching = q.length > 0;
    el.count.hidden = !searching;
    if (searching) el.count.textContent = "顯示 " + shown + " / " + total + " 個指令";

    var none = DATA.groups.length === 0 || (searching && shown === 0);
    el.empty.hidden = !none;
    if (DATA.groups.length === 0) el.empty.textContent = "還沒有任何指令。";
    else if (searching && shown === 0) el.empty.textContent = "沒有符合的指令。換個關鍵字試試看。";
    el.note.hidden = DATA.groups.length === 0;
  }

  function showLoadError(msg) {
    el.groups.innerHTML = "";
    el.empty.hidden = false;
    el.empty.textContent = msg;
  }

  async function load() {
    if (location.protocol === "file:") {
      showLoadError("無法在「直接雙擊開啟」的情況下讀取 commands.json。" +
        "請用本機伺服器預覽（在此資料夾執行 python -m http.server 8000），" +
        "或把檔案上傳到 GitHub Pages 後再打開。");
      return;
    }
    try {
      var res = await fetch("./commands.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      DATA = sanitize(await res.json());
      render();
    } catch (err) {
      console.error(err);
      showLoadError("載入 commands.json 失敗，請稍後再試。");
    }
  }

  el.search.addEventListener("input", function () {
    query = el.search.value;
    render();
  });

  load();
})();
</script>
</body>
</html>
